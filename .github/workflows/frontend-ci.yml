name: Company Panel CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-smoke-failures
          path: /tmp/cubegears-ui-smoke
          if-no-files-found: ignore
      - run: npm run build
        env:
          # Harmless build-only placeholder; deployment must supply its real API URL.
          VITE_API_URL: https://api.example.invalid/api/v1
