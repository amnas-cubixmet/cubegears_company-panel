name: Company Panel CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/stockMargin.test.js tests/dailyWageOnlyUI.test.js tests/dashboardBookingText.test.js tests/globalFormTypography.test.js tests/jobOutsideStaffUI.test.js tests/outsideStaffMobile.test.js tests/jobWorkSimpleLayout.test.js tests/jobMechanicOutsideRecords.test.js tests/jobTotalCostUI.test.js tests/formControlsUnified.test.js tests/jobComplaintsUI.test.js tests/jobComplaintViewPage.test.js tests/autoComplaintStatus.test.js tests/jobPartsResponsiveWorkflow.test.js
      - run: npm run build
