name: Company Panel CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/dailyWageOnlyUI.test.js tests/dashboardBookingText.test.js tests/globalFormTypography.test.js tests/jobOutsideStaffUI.test.js tests/outsideStaffMobile.test.js tests/jobWorkSimpleLayout.test.js tests/jobMechanicOutsideRecords.test.js tests/jobTotalCostUI.test.js tests/jobCostAutoUpdate.test.js tests/formControlsUnified.test.js tests/jobComplaintsUI.test.js tests/jobWorkPhotoUI.test.js tests/jobOutsidePartPurchase.test.js tests/jobComplaintViewPage.test.js tests/autoComplaintStatus.test.js tests/jobPartsResponsiveWorkflow.test.js tests/outsideWorkerSearch.test.js tests/jobPartsStockFinder.test.js tests/jobPartsUIRefresh.test.js tests/jobPartsModalUI.test.js tests/jobPartsTableOutsideUI.test.js tests/jobPartsRecordRowsUI.test.js tests/jobActivityTimeline.test.js tests/jobFullLogTab.test.js tests/stockEasyPageUI.test.js tests/customersUnifiedPage.test.js tests/jobCustomerContactActions.test.js tests/customerDirectoryContactProfile.test.js tests/quickEstimateValidation.test.js tests/globalDialogsUI.test.js tests/estimateAddNewCatalog.test.js tests/approvedEstimatePdf.test.js tests/jobQualityCheckUI.test.js tests/customerDirectoryMoney.test.js tests/customerProfilePolish.test.js
      - run: npm run build
