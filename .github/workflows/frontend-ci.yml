name: Company Panel CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/sidebarMobileAlignment.test.js
      - run: node --test tests/mobileCreditChipCompact.test.js
      - run: node --test tests/freeCoreModulesUi.test.js tests/accountWorkspace.test.js tests/emptyCompanyFeatureNav.test.js
      - run: node --test tests/workspaceResponsivePolish.test.js
      - run: node --test tests/restoreCommitUiMobileNav.test.js
      - run: node --test tests/authEmailValidation.test.js tests/productionSignupSecurity.test.js tests/dailyWageOnlyUI.test.js tests/dashboardBookingText.test.js tests/globalFormTypography.test.js tests/jobOutsideStaffUI.test.js tests/outsideStaffMobile.test.js tests/jobWorkSimpleLayout.test.js tests/jobMechanicOutsideRecords.test.js tests/jobTotalCostUI.test.js tests/jobCostAutoUpdate.test.js tests/formControlsUnified.test.js tests/jobComplaintsUI.test.js tests/staffInviteDeliveryUI.test.js tests/staffAuthAccessErrors.test.js tests/databaseOnlyAuthUI.test.js tests/paymentPageUI.test.js tests/jobUpdatePhotosUI.test.js tests/jobWorkPhotoUI.test.js tests/jobOutsidePartPurchase.test.js tests/jobComplaintViewPage.test.js tests/autoComplaintStatus.test.js tests/jobPartsResponsiveWorkflow.test.js tests/outsideWorkerSearch.test.js tests/jobPartsStockFinder.test.js tests/jobPartsUIRefresh.test.js tests/jobPartsModalUI.test.js tests/jobPartsTableOutsideUI.test.js tests/jobPartsRecordRowsUI.test.js tests/jobActivityTimeline.test.js tests/jobFullLogTab.test.js tests/stockEasyPageUI.test.js tests/customersUnifiedPage.test.js tests/jobCustomerContactActions.test.js tests/customerDirectoryContactProfile.test.js tests/quickEstimateValidation.test.js tests/indiaGstEstimate.test.js tests/globalDialogsUI.test.js tests/estimateAddNewCatalog.test.js tests/approvedEstimatePdf.test.js tests/jobQualityCheckUI.test.js tests/customerDirectoryMoney.test.js tests/customerProfilePolish.test.js tests/customerVehicleBreadcrumbLabels.test.js tests/reportsDashboardCharts.test.js tests/accountBackendUi.test.js tests/accountCompanyValidation.test.js tests/notificationsInboxUI.test.js tests/invoicePdfDownload.test.js tests/settingsResponsiveUI.test.js tests/billingUnifiedUI.test.js tests/accountWorkspaceUnified.test.js tests/projectInlineInputErrors.test.js tests/expensesUI.test.js tests/razorpayCheckoutUi.test.js tests/planMarketplaceRoute.test.js
      - run: node --test tests/invoiceTabsAttributes.test.js
      - run: node --test tests/creditNavigation.test.js
      - run: node --test tests/razorpayGatewayDiagnostics.test.js
      - run: node --test tests/featureBundlesUi.test.js
      - run: node --test tests/featureEntitlementNavigation.test.js
      - run: node --test tests/postpaidFeatureNavigation.test.js
      - run: node --test tests/emptyCompanyFeatureNav.test.js
      - run: node --test tests/accountSevenPagesUi.test.js
      - run: node --test tests/companyFeatureAccessUi.test.js
      - run: node --test tests/activatedLabelsOnlyUi.test.js
      - run: node --test tests/saasFullWidthSidebar.test.js
      - run: npm run build
        env:
          # Harmless build-only placeholder; deployment must supply its real API URL.
          VITE_API_URL: https://api.example.invalid/api/v1
